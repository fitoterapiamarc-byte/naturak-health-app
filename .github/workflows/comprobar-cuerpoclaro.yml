name: Verificar seguridad y compilacion CuerpoClaro

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/comprobar-cuerpoclaro.yml'
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Auditar todas las fichas
        run: node scripts/auditar-fichas.mjs
      - name: Guardar informe de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-completa-cuerpoclaro
          path: |
            auditoria-fichas.json
            auditoria-fichas.md
          if-no-files-found: warn
      - name: Verificar compilacion web
        run: npm run build
