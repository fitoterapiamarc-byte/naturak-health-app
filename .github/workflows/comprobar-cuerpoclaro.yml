name: Verificar seguridad y compilacion CuerpoClaro

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/comprobar-cuerpoclaro.yml'
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Verificar compilacion web
        run: npm run build
